name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 💉 Inject Supabase secrets into appsettings.json
        run: |
          sed -i "s|SUPABASE_URL_PLACEHOLDER|${{ secrets.SUPABASE_URL }}|g" PersonalGTD.Web/wwwroot/appsettings.json
          sed -i "s|SUPABASE_KEY_PLACEHOLDER|${{ secrets.SUPABASE_KEY }}|g" PersonalGTD.Web/wwwroot/appsettings.json
          sed -i "s|SUPABASE_URL_PLACEHOLDER|${{ secrets.SUPABASE_URL }}|g" PersonalGTD.Web/Program.cs
          sed -i "s|SUPABASE_KEY_PLACEHOLDER|${{ secrets.SUPABASE_KEY }}|g" PersonalGTD.Web/Program.cs
        working-directory: ${{ github.workspace }}

      - name: 🏗️ Publish Blazor WebAssembly
        run: |
          dotnet publish PersonalGTD.Web/PersonalGTD.Web.csproj \
            -c Release \
            -o release \
            --nologo
        working-directory: ${{ github.workspace }}

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blazor-pages
          path: release/wwwroot

      - name: 🛠️ Configure Base Path and 404.html
        run: |
          # Extraire le nom du dépôt
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          
          # S'assurer que le base href est correct dans l'index.html publié
          sed -i "s|<base href=\"/\" />|<base href=\"/${REPO_NAME}/\" />|g" release/wwwroot/index.html
          
          # Générer le 404.html dynamique pour le routage SPA
          cat > release/wwwroot/404.html << EOF
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <title>Mon organiseur - Redirection...</title>
              <script type="text/javascript">
                  var pathSegmentsToKeep = 1;
                  var l = window.location;
                  l.replace(
                      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
                      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
                      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                      l.hash
                  );
              </script>
          </head>
          <body>Redirection en cours...</body>
          </html>
          EOF
          
          echo "Base path set to /${REPO_NAME}/ and 404.html generated."
        working-directory: ${{ github.workspace }}

      - name: 🔇 Disable Jekyll processing
        run: touch release/wwwroot/.nojekyll
        working-directory: ${{ github.workspace }}

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: release/wwwroot
          force_orphan: true
