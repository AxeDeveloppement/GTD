name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: windows-latest

    env:
      KEYSTORE_PATH: release-key.jks

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore dependencies
        run: dotnet restore PersonalGTD.Android/PersonalGTD.Android.csproj

      - name: Generate signing key
        run: |
          keytool -genkeypair `
            -dname "cn=PersonalGTD, ou=Dev, o=PersonalGTD, L=Paris, S=IDF, C=FR" `
            -keystore $env:KEYSTORE_PATH `
            -storepass android `
            -keypass android `
            -alias personalgtd `
            -keyalg RSA `
            -keysize 2048 `
            -validity 10000

      - name: Publish APK (signed)
        run: |
          dotnet publish PersonalGTD.Android/PersonalGTD.Android.csproj `
            -c Release `
            -f net9.0-android `
            -o ./publish `
            -p:AndroidPackageFormat=apk `
            -p:EmbedAssembliesIntoApk=true `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore=$env:KEYSTORE_PATH `
            -p:AndroidSigningKeyAlias=personalgtd `
            -p:AndroidSigningKeyPass=android `
            -p:AndroidSigningStorePass=android

      - name: List published files
        shell: bash
        run: ls -la ./publish/

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: ./publish/

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "APK Build #${{ github.run_number }}"
          files: ./publish/**/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
