name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore dependencies
        run: dotnet restore PersonalGTD.Android/PersonalGTD.Android.csproj

      - name: Publish APK
        shell: bash
        run: |
          dotnet publish PersonalGTD.Android/PersonalGTD.Android.csproj \
            -c Release \
            -f net9.0-android \
            -o ./publish \
            /p:AndroidPackageFormat=apk \
            /p:EmbedAssembliesIntoApk=true

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: apk-${{ github.run_number }}
          name: "APK Build #${{ github.run_number }}"
          files: ./publish/com.axeldeveloppement.gtd.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
