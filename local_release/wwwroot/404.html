<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mon organiseur - Redirection...</title>
    <script type="text/javascript">
        // Single Page Apps pour GitHub Pages
        // Ce script permet de rediriger les routes 404 vers l'index.html tout en préservant la route
        var pathSegmentsToKeep = 1; // Correspond au nom du dépôt /GTD/

        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>
<body>
    Redirection en cours...
</body>
</html>
