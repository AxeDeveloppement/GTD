<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Mon organiseur</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="PersonalGTD.Android.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>
    <div class="status-bar-safe-area"></div>
    <div id="app">Chargement en cours...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js"></script>
    <script>
        window.notificationHelper = {
            navHandler: null,
            registerNavigationHandler: function(dotNetObj) {
                this.navHandler = dotNetObj;
            },
            requestPermission: async function() {
                if (!("Notification" in window)) return "not_supported";
                try {
                    const permission = await Notification.requestPermission();
                    return permission;
                } catch (e) {
                    return "error";
                }
            },
            showNotification: function(title, body, tag) {
                if (!("Notification" in window) || Notification.permission !== "granted") return;
                
                const options = {
                    body: body,
                    icon: 'icon-192.png',
                    tag: tag,
                    renotify: true,
                    requireInteraction: true
                };
                const n = new Notification(title, options);
                const self = this;
                n.onclick = function(event) {
                    event.preventDefault();
                    window.focus();
                    
                    if (tag && tag.startsWith('agenda-')) {
                        if (self.navHandler) {
                            self.navHandler.invokeMethodAsync('NavigateTo', 'agenda');
                        } else {
                            window.location.href = window.location.origin + "/agenda";
                        }
                    }
                    n.close();
                };
            }
        };
    </script>
</body>
</html>
